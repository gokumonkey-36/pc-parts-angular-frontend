apiVersion: v1
kind: Service
metadata:
  name: pc-frontend-svc
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: pc-frontend-service

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pc-frontend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pc-frontend-service
  template:
    metadata:
      labels:
        app: pc-frontend-service
    spec:
      containers:
      - image: gokumonkey/pc-frontend-service:1
        name: pc-frontend-microservice
        imagePullPolicy: Always
        ports:
        - containerPort: 80
